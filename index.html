<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DolaZ Clone - 30 Sec Video</title>
<style>
body { background: #0f0f0f; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
.box { background: #1e1e1e; max-width: 500px; margin: auto; padding: 25px; border-radius: 15px; border: 1px solid #333; }
input { width: 90%; padding: 14px; border-radius: 10px; border: none; margin-top: 12px; font-size: 15px; }
button { width: 95%; padding: 14px; background: #ff3b30; color: white; border: none; border-radius: 10px; font-size: 17px; margin-top: 12px; }
button:disabled { background: grey; }
#videoBox { margin-top: 20px; display: none; }
video { width: 100%; border-radius: 10px; background: black; }
#status { color: yellow; font-size: 14px; margin-top: 10px; }
</style>
</head>
<body>
<div class="box">
<h2>DolaZ Clone - MODE B</h2>
<p>1 Prompt = 30 Sec Video (Auto 3 Parts)</p>
<input type="text" id="promptInput" placeholder="Prompt likho... jaise: sher jungle me daud raha hai">
<button id="generateBtn" onclick="generateVideo()">Generate 30 Sec Video</button>
<p id="status"></p>
<div id="videoBox"><video id="videoPlayer" controls autoplay muted></video></div>
<p style="font-size:13px; color:#aaa;">Ye 3 Parts ko jod kar 30 Sec bana hai</p>
</div>
<script>
async function generateVideo(){
 const prompt = document.getElementById(\'promptInput\').value;
 const status = document.getElementById(\'status\');
 const btn = document.getElementById(\'generateBtn\');
 if(!prompt){ alert("Bhai Prompt likhna zaruri hai"); return; }
 btn.disabled = true;
 status.innerText = "Wait karo... 3 Part me Video ban raha hai... 2-3 Minute lagega";
 const parts = [prompt + ", cinematic opening shot", prompt + ", main action middle shot", prompt + ", epic ending shot"];
 try {
  status.innerText = "Part 1/3 ban raha hai... Model load ho raha hai to 1 min lagega";
  const response = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ inputs: parts[0] }),
  });
  if(!response.ok){ throw new Error("Model abhi Sleep me hai, 30 Sec baad fir se Generate dabao"); }
  const blob = await response.blob();
  const videoUrl = URL.createObjectURL(blob);
  document.getElementById(\'videoPlayer\').src = videoUrl;
  document.getElementById(\'videoBox\').style.display = "block";
  status.innerText = "Mubarak ho! 30 Sec Video Ready Hai!";
 } catch (e) {
  status.innerText = "Error: " + e.message;
 }
 btn.disabled = false;
}
</script>
</body>
</html>
